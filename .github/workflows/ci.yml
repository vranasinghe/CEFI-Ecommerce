name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm ci
      - run: npm run build

  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci

  # Fails the PR / push if the new commits ADD a password, API key or .env
  # file. Only added lines are scanned, so history before this job existed
  # (e.g. commit d3b195b) doesn't fail every run.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Scan pull request changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-secrets.js --range "origin/${{ github.base_ref }}...${{ github.sha }}"
      - name: Scan pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/check-secrets.js --range "${{ github.event.before }}..${{ github.sha }}"

  # Fails if a database script is emptied, or the lock-down script loses the
  # steps that close browser write access (see scripts/check-sql-files.js).
  sql-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: node scripts/check-sql-files.js

  # Fails the PR / push if a shipped dependency has a known vulnerability of
  # moderate severity or worse (Master-Vault item 66).
  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    defaults:
      run:
        working-directory: ./${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate
